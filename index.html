<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurd Image Quiz</title>
<!-- ئایکۆنی Add to Home Screen بۆ ئایفۆن و ئەندرۆید -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="16x16" href="apple-touch-icon.png">
<!-- ڕێکخستنی ناونیشان و ڕوکار کاتێک لەسەر شاشەی مۆبایل دایدەنێیت -->
<meta name="apple-mobile-web-app-title" content="Kurd Image Quiz">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
--bg-color: #0b0f19;
--card-bg: #131b2e;
--accent-blue: #3b82f6;
--accent-purple: #8b5cf6;
--text-main: #f3f4f6;
--text-sub: #9ca3af;
--border-color: #1f293d;
}
body {
margin: 0;
padding: 0;
font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
background-color: var(--bg-color);
color: var(--text-main);
display: flex;
justify-content: center;
min-height: 100vh;
}
.container {
width: 100%;
max-width: 480px;
padding: 20px;
box-sizing: border-box;
}
.header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 24px;
}
.logo-area {
display: flex;
align-items: center;
gap: 12px;
}
.logo-img {
width: 44px;
height: 44px;
border-radius: 50%;
object-fit: cover;
}
.title-area h1 {
font-size: 16px;
margin: 0;
font-weight: 700;
}
.title-area p {
font-size: 12px;
color: var(--text-sub);
margin: 2px 0 0 0;
}
.lang-pills {
display: flex;
gap: 6px;
background: var(--card-bg);
padding: 4px;
border-radius: 20px;
border: 1px solid var(--border-color);
}
.lang-btn {
background: transparent;
border: none;
color: var(--text-sub);
padding: 4px 10px;
border-radius: 16px;
font-size: 12px;
cursor: pointer;
}
.lang-btn.active {
background: var(--accent-blue);
color: #fff;
}
.upload-box {
border: 2px dashed var(--border-color);
border-radius: 16px;
padding: 30px 20px;
text-align: center;
background: var(--card-bg);
margin-bottom: 20px;
cursor: pointer;
}
.upload-icon {
font-size: 32px;
color: var(--accent-blue);
margin-bottom: 10px;
}
.options-group {
background: var(--card-bg);
border-radius: 16px;
padding: 16px;
margin-bottom: 16px;
border: 1px solid var(--border-color);
}
.group-title {
font-size: 13px;
color: var(--text-sub);
margin-bottom: 12px;
}
.grid-2 {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.opt-card {
background: rgba(255, 255, 255, 0.03);
border: 1px solid var(--border-color);
border-radius: 12px;
padding: 12px;
text-align: center;
cursor: pointer;
font-size: 13px;
}
.opt-card.active {
border-color: var(--accent-blue);
background: rgba(59, 130, 246, 0.1);
color: var(--accent-blue);
}
.counter-row {
display: flex;
align-items: center;
justify-content: space-between;
background: rgba(255, 255, 255, 0.03);
border-radius: 12px;
padding: 8px 16px;
}
.count-btn {
background: var(--border-color);
border: none;
color: white;
width: 32px;
height: 32px;
border-radius: 8px;
font-size: 18px;
cursor: pointer;
}
.submit-btn {
width: 100%;
background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
border: none;
color: white;
padding: 14px;
border-radius: 14px;
font-size: 15px;
font-weight: 600;
cursor: pointer;
margin-top: 10px;
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo-area">
<img src="apple-touch-icon.png" alt="Brain Icon" class="logo-img">
<div class="title-area">
<h1>Kurd Image Quiz</h1>
<p>v2.0</p>
</div>
</div>
<div class="lang-pills">
<button class="lang-btn active">کوردی</button>
<button class="lang-btn">Türkçe</button>
<button class="lang-btn">EN</button>
</div>
</div>
<div class="upload-box">
<div class="upload-icon">☁️</div>
<div id="ui-upload-title" style="font-weight: 600; margin-bottom: 4px;">وێنەیەک هەڵبژێرە یاخود دابینێ</div>
<div id="ui-upload-sub" style="font-size: 12px; color: var(--text-sub);">پشتیوانی لە JPG, PNG, WEBP دەکرێت</div>
</div>
<div class="options-group">
<div id="ui-qtype-title" class="group-title">شێوازی پرسیارەکان</div>
<div class="grid-2">
<div class="opt-card active">تێکەڵ (هەموجۆر)</div>
<div class="opt-card">فره هەڵبژاردن</div>
<div class="opt-card">ڕاست و هەڵە</div>
<div class="opt-card">کورته وەڵام</div>
</div>
</div>
<div class="options-group">
<div id="ui-qlang-title" class="group-title">هەڵبژاردنی زمانی پرسیارەکان:</div>
<div class="grid-2" style="grid-template-columns: repeat(4, 1fr);">
<button class="lang-btn active" onclick="setQuestionLang('ckb', this)">کوردی</button>
<button class="lang-btn" onclick="setQuestionLang('tr', this)">Türkçe</button>
<button class="lang-btn" onclick="setQuestionLang('ar', this)">عربي</button>
<button class="lang-btn" onclick="setQuestionLang('en', this)">English</button>
</div>
</div>
<button class="submit-btn" id="ui-submit-btn">✨ دروستکردنی کۆیز</button>
</div>
<script>
function setQuestionLang(lang, el) {
let buttons = el.parentElement.querySelectorAll('.lang-btn');
buttons.forEach(btn => btn.classList.remove('active'));
el.classList.add('active');
console.log("Question Language set to:", lang);
}
</script>
</body>
</html>
